name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: aarch64-linux-android
    - name: install.ndk
      run: cargo install cargo-ndk
    - name: build
      run: cargo ndk --target aarch64-linux-android --platform 24 build --release
    - name: run
      run: |
        pushd ./target/aarch64-linux-android/release
        ./rs list
        ./rs download 鲁班七号
        tar -czf ../../../rs.tar.gz ./rs
        popd
    - name: tar gz
      run: |
        pushd ./target/aarch64-linux-android/release
        tar -czf ../../../rs.tar.gz ./rs
        popd
    - uses: actions/upload-artifact@v7
      with:
        name: rs-android
        path: ./rs.tar.gz
