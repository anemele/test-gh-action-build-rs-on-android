name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
            
env:
  CARGO_TERM_COLOR: always
              
jobs:
  build:
                
    runs-on: ubuntu-latest
                    
    steps:
    - uses: actions/checkout@v5
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: aarch64-linux-android
    - name: run
      run: |
        cargo build --release
        ./target/release/rs list
        ./target/release/rs download 鲁班七号
    - uses: actions/upload-artifact@v7
      with:
        path:
          ./target/release/rs
